<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Lyric Visualizer</title>
<!-- Fonts are optional: if offline, the page falls back to Impact / system sans. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   THEME TOKENS
   --accent / --accent-rgb are rewritten by JS when you switch presets
   (and nudged every frame by the beat-driven colour shift).
   ===================================================================== */
:root {
  --accent: #18e6ff;
  --accent-rgb: 24, 230, 255;
  --bg: #050507;
  --fg: #f4f1ea;
  --muted: rgba(244, 241, 234, .55);
  --faint: rgba(244, 241, 234, .12);
  --glass: rgba(10, 10, 14, .78);
  --lyric-font: 'Anton', Impact, 'Arial Narrow Bold', sans-serif;
  --ui-font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--ui-font);
  -webkit-font-smoothing: antialiased;
}
body.idle { cursor: none; }
button { font: inherit; color: inherit; }

/* ---------- Layers: canvas (bg + bars) → vignette → lyrics → UI ---------- */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#vignette {
  position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 80%, rgba(0,0,0,.9) 100%);
}

/* ---------- Lyrics ---------- */
#lyrics {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 5vw;
}
/* Every line (current + exiting ones) sits in the same grid cell so they overlap */
#lineWrap { display: grid; place-items: center; width: 100%; }
#lineWrap > .line { grid-area: 1 / 1; }

.line {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
  gap: 0 .26em;
  max-width: min(92vw, 1500px);
  font-family: var(--lyric-font);
  text-transform: uppercase;
  line-height: 1.04;
  letter-spacing: .005em;
  text-align: center;
  color: var(--fg);
  will-change: transform;
  /* --glow (0..~1.5) is set every frame from the beat */
  text-shadow:
    0 0 calc(var(--glow, 0) * 30px) rgba(var(--accent-rgb), calc(var(--glow, 0) * .85)),
    0 4px 30px rgba(0, 0, 0, .65);
}
.word { position: relative; display: inline-block; white-space: nowrap; transition: color .12s linear; }
.ch   { display: inline-block; opacity: 0; will-change: transform, opacity; }
.word.current { color: var(--accent); }
.word.sung    { color: var(--fg); }

/* Glitch: two clipped, offset copies of each visible word (Chaos preset) */
.line.glitch .word.current::before, .line.glitch .word.current::after,
.line.glitch .word.sung::before,    .line.glitch .word.sung::after {
  content: attr(data-w);
  position: absolute; left: 0; top: 0; width: 100%;
  pointer-events: none;
}
.line.glitch .word::before { color: var(--accent); transform: translateX(var(--gx, .05em)); clip-path: inset(10% 0 54% 0); }
.line.glitch .word::after  { color: #fff; transform: translateX(calc(var(--gx, .05em) * -1)); clip-path: inset(60% 0 4% 0); opacity: .85; }

/* Preset typography tweaks */
body[data-preset="minimal"] .line {
  font-family: var(--ui-font); font-weight: 800; text-transform: none;
  letter-spacing: -.035em; line-height: 1.08; gap: 0 .24em;
}

/* Intro card (before the first lyric) */
#intro {
  position: absolute; text-align: center; opacity: 0; transform: translateY(12px);
  transition: opacity .8s ease, transform .8s ease;
}
#intro.show { opacity: 1; transform: none; }
#intro .eyebrow {
  font-family: var(--mono); font-size: 12px; letter-spacing: .4em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 18px;
}
#introTitle {
  margin: 0; font-family: var(--lyric-font); font-weight: 400; text-transform: uppercase;
  font-size: clamp(40px, 8vw, 120px); line-height: .95; letter-spacing: .01em;
}
#introArtist { margin-top: 14px; color: var(--muted); font-size: clamp(14px, 1.6vw, 20px); letter-spacing: .08em; }

/* Faint preview of the next line (Minimal preset) */
#nextLine {
  position: absolute; bottom: 21vh; left: 0; right: 0; text-align: center;
  font-size: clamp(13px, 1.5vw, 18px); color: var(--muted); letter-spacing: .04em;
  opacity: 0; transition: opacity .5s ease;
  padding: 0 6vw;
}
#nextLine.show { opacity: .7; }

/* ---------- Chrome (top bar, controls, hint, panel) ---------- */
.chrome { transition: opacity .6s ease, transform .6s ease; }
body.idle .chrome { opacity: 0; pointer-events: none; }
body.idle #controls { transform: translateY(14px); }
body.idle #topbar { transform: translateY(-14px); }

#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 16px;
  padding: 18px 24px;
  background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .3em; font-weight: 500;
}
.brand small { color: var(--muted); letter-spacing: .15em; font-weight: 400; }
#beatDot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 12px var(--accent); opacity: .35;
}
#nowPlaying {
  flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; gap: 10px;
  font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#npTitle { overflow: hidden; text-overflow: ellipsis; }
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  padding: 3px 8px; border: 1px solid rgba(var(--accent-rgb), .5); color: var(--accent); border-radius: 99px;
}
.chip[hidden] { display: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 16px; border-radius: 99px;
  border: 1px solid var(--faint); background: rgba(255,255,255,.04);
  font-size: 13px; font-weight: 500; cursor: pointer; position: relative;
  transition: background .2s, border-color .2s, color .2s;
}
.btn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.25); }
.btn.primary { background: var(--accent); color: #050507; border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn:focus-within, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.icon {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--faint); background: rgba(255,255,255,.04); cursor: pointer;
  transition: background .2s, border-color .2s;
}
.icon:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.3); }
.icon svg { width: 18px; height: 18px; }

#controls {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 40px 24px 20px;
  background: linear-gradient(to top, rgba(0,0,0,.85) 30%, transparent);
}
.seekrow { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 40px; }
.seekrow .mono:last-child { text-align: right; }

.row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.spacer { flex: 1; }

#playBtn {
  width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: #050507; display: grid; place-items: center;
  box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .5);
  transition: transform .15s ease, box-shadow .3s ease;
}
#playBtn:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(var(--accent-rgb), .45); }
#playBtn svg { width: 22px; height: 22px; fill: currentColor; }

.slider { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
.slider label {
  display: flex; justify-content: space-between; gap: 10px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.slider output { color: var(--fg); }

/* Range inputs: thin line + accent fill (--p = fill %) */
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; margin: 0;
  --p: 50%;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) var(--p), rgba(255,255,255,.16) var(--p));
}
input[type=range]::-moz-range-track {
  height: 3px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) var(--p), rgba(255,255,255,.16) var(--p));
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%;
  background: var(--fg); border: 0; box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .35);
}
input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: 0;
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .35);
}
#seek { flex: 1; }

/* Tiny bass/mid/high meters so you can tune sensitivity by eye */
.meters { display: flex; align-items: flex-end; gap: 4px; height: 28px; }
.meters i {
  display: block; width: 5px; height: 100%; background: var(--accent); border-radius: 2px;
  transform-origin: bottom; transform: scaleY(.08); opacity: .85;
}
.meters i:nth-child(2) { opacity: .6; }
.meters i:nth-child(3) { opacity: .4; }

.presets { display: flex; border: 1px solid var(--faint); border-radius: 99px; padding: 3px; }
.presets button {
  border: 0; background: transparent; cursor: pointer; padding: 7px 14px; border-radius: 99px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  transition: background .2s, color .2s;
}
.presets button:hover { color: var(--fg); }
.presets button[aria-pressed="true"] { background: var(--accent); color: #050507; }

/* Start hint */
#hint {
  position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%);
  font-size: 13px; color: var(--muted); text-align: center; white-space: nowrap;
  transition: opacity .6s;
}
#hint.gone { opacity: 0; pointer-events: none; }
#hint button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
kbd {
  font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--faint); background: rgba(255,255,255,.06); color: var(--fg);
}

/* ---------- Load panel (right drawer) ---------- */
#panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
  background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  border-left: 1px solid var(--faint);
  transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column; overflow-y: auto;
  padding: 22px 24px 28px; z-index: 10;
}
#panel.open { transform: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.panel-head h2 { margin: 0; font-family: var(--lyric-font); font-weight: 400; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; }
#panel section { padding: 18px 0; border-bottom: 1px solid var(--faint); }
#panel section:last-child { border-bottom: 0; }
#panel h3 {
  margin: 0 0 12px; display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500;
}
#panel h3 span { color: var(--accent); }

.drop {
  display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 12px; cursor: pointer;
  border: 1px dashed rgba(255,255,255,.22); background: rgba(255,255,255,.03);
  transition: border-color .2s, background .2s; position: relative;
}
.drop:hover, .drop:focus-within { border-color: var(--accent); background: rgba(var(--accent-rgb), .06); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop-main { font-weight: 600; font-size: 14px; }
.drop-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

textarea {
  width: 100%; height: 230px; resize: vertical;
  background: rgba(0,0,0,.45); color: var(--fg); border: 1px solid var(--faint); border-radius: 10px;
  padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6;
}
.btnrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btnrow .primary { margin-left: auto; }
.status { margin: 10px 0 0; font-size: 12px; color: var(--muted); min-height: 1em; }
.status.err { color: #ff6b6b; }
.status.ok { color: var(--accent); }
.keys dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 12.5px; color: var(--muted); }
.keys dt { text-align: right; }

/* Drag & drop overlay */
#dropOverlay {
  position: fixed; inset: 14px; border: 2px dashed var(--accent); border-radius: 18px;
  display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .2s;
  font-family: var(--mono); letter-spacing: .3em; text-transform: uppercase; font-size: 13px; color: var(--accent);
  background: rgba(var(--accent-rgb), .05); z-index: 20;
}
body.dragging #dropOverlay { opacity: 1; }

/* ---------- Small screens ---------- */
@media (max-width: 760px) {
  #topbar { padding: 14px 16px; }
  #nowPlaying { display: none; }
  #controls { padding: 30px 16px 14px; }
  .row { gap: 12px 16px; }
  .slider { min-width: 0; flex: 1 1 40%; }
  .meters { display: none; }
  .spacer { display: none; }
  #hint { bottom: 210px; white-space: normal; width: calc(100% - 32px); }
  #nextLine { bottom: 30vh; }
}
@media (prefers-reduced-motion: reduce) {
  .chrome, #panel, #intro { transition: none; }
}
</style>
</head>
<body data-preset="neon">

<canvas id="stage"></canvas>
<div id="vignette"></div>

<main id="lyrics">
  <div id="intro" class="show">
    <div class="eyebrow">Now playing</div>
    <h1 id="introTitle">—</h1>
    <div id="introArtist"></div>
  </div>
  <div id="lineWrap"></div>
  <div id="nextLine" aria-hidden="true"></div>
</main>

<header id="topbar" class="chrome">
  <div class="brand"><span id="beatDot"></span>PULSE <small>/ lyric engine</small></div>
  <div id="nowPlaying"><span id="npTitle"></span><span class="chip" id="modeChip">Demo · simulated beat</span></div>
  <button class="btn" id="openPanel">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
    Load song &amp; lyrics
  </button>
</header>

<div id="hint" class="chrome">
  Press <kbd>Space</kbd> to play the built-in sample (silent, simulated beat) — or <button id="hintLoad">load your own song</button>
</div>

<footer id="controls" class="chrome">
  <div class="seekrow">
    <span class="mono" id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Seek" style="--p:0%">
    <span class="mono" id="tDur">0:00</span>
  </div>
  <div class="row">
    <button id="playBtn" aria-label="Play"></button>

    <div class="slider">
      <label for="offset">Lyric offset <output id="offsetOut">0.00s</output></label>
      <input type="range" id="offset" min="-2" max="2" step="0.05" value="0" title="Double-click to reset">
    </div>
    <div class="slider">
      <label for="sens">Beat sensitivity <output id="sensOut">5</output></label>
      <input type="range" id="sens" min="1" max="10" step="0.5" value="5">
    </div>
    <div class="meters" title="Bass / Mids / Highs"><i id="mB"></i><i id="mM"></i><i id="mH"></i></div>

    <div class="spacer"></div>

    <div class="presets" role="group" aria-label="Visual style">
      <button data-preset="minimal">Minimal</button>
      <button data-preset="neon">Neon</button>
      <button data-preset="chaos">Chaos</button>
    </div>
    <button class="icon" id="fsBtn" aria-label="Fullscreen"></button>
  </div>
